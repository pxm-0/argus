# Reviewed runtime for the nodens-staging workload in personal-managed.
# Both images are domain-local IDs printed by scripts/argus-image-import; a
# workload.deploy targetRevision must equal one of these lines exactly. Until
# the first import, the PENDING pins fail closed (no deploy can match them).
name: nodens-staging

services:
  nodens:
    image: sha256:e8f2abf0300b7031e22ab633eade07dad327bbcab3572e26d0eb007d27569733  # ghcr.io/pxm-0/nodens@sha256:e8f2abf0300b7031e22ab633eade07dad327bbcab3572e26d0eb007d27569733 (nodens aec2b0a)
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    # nginx master needs these four to bind :80 and drop to its worker user
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  argus-ingress:
    image: sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9  # caddy:2 (docker.io/library/caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9)
    command: ["caddy", "run", "--config", "/etc/caddy/ingress.json"]
    depends_on:
      nodens:
        condition: service_started
    restart: unless-stopped
    # Not read_only: Compose refuses inline config content on read-only services.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    configs:
      - source: ingress
        target: /etc/caddy/ingress.json
    volumes:
      - type: bind
        source: /var/lib/argus/managed-ingress/nodens-staging
        target: /run/argus-ingress
    networks:
      - internal

networks:
  internal:
    internal: true

configs:
  ingress:
    content: |
      {"apps":{"http":{"servers":{"ingress":{"listen":["unix//run/argus-ingress/upstream.sock|0666"],"routes":[{"handle":[{"handler":"reverse_proxy","upstreams":[{"dial":"nodens:80"}]}]}]}}}}}
