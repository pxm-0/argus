name: Tests

on:
  pull_request:
  push:
    branches: [main, argus]

permissions:
  contents: read

jobs:
  unittest:
    name: argus-check (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run the canonical repository check
        run: ./scripts/argus-check
