name: P0 PR Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, argus]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate P0 PR body
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY", "")
          base = os.environ.get("PR_BASE", "")
          required = [
              "## P0 Scope",
              "## Verification",
              "## Safety Checklist",
              "Acceptance summaries",
              "- [x] This PR is phase-scoped",
              "- [x] No secrets",
              "- [x] No Tailscale Funnel was enabled.",
              "- [x] No Cloudflare tunnel was started or enabled.",
              "- [x] No DNS records were created.",
              "- [x] No router ports were opened.",
              "- [x] No public route was exposed.",
          ]

          missing = [item for item in required if item not in body]
          if missing:
              print("P0 PR body is missing required confirmations:")
              for item in missing:
                  print(f"- {item}")
              sys.exit(1)

          if base != "main":
              print("P0 remediation PRs must target main.")
              sys.exit(1)

          evidence_choices = (
              "- [x] Acceptance summary attached above.",
              "- [x] Acceptance summary N/A (docs-only or no server evidence required); reason documented in Notes.",
          )
          selected_evidence = [choice for choice in evidence_choices if choice in body]
          if len(selected_evidence) != 1:
              print("P0 PR body must choose exactly one acceptance-summary disposition.")
              sys.exit(1)
          acceptance_section = body.split("Acceptance summaries", 1)[1].split("## Safety Checklist", 1)[0]
          if selected_evidence[0] == evidence_choices[0]:
              row = re.compile(
                  r"^\| [a-z0-9]+(?:-[a-z0-9]+)* \| (?:baseline|pre|post|rollback) "
                  r"\| (?:oreochiserver|local-ci|browser-private-origin) \| 3/3 "
                  r"\| (?:pass|fail|blocked) \| `sha256:[0-9a-f]{64}` "
                  r"\| `sha256:[0-9a-f]{64}` \|$",
                  re.MULTILINE,
              )
              if not row.search(acceptance_section):
                  print("Attached acceptance summary must contain one valid emitted Markdown row.")
                  sys.exit(1)
          if selected_evidence[0] == evidence_choices[1]:
              notes = body.split("## Notes", 1)[1].strip() if "## Notes" in body else ""
              if not notes or notes == "-":
                  print("Acceptance-summary N/A requires a reason in Notes.")
                  sys.exit(1)

          print("P0 PR contract ok")
          PY

  flag-direct-main-push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/argus')
    runs-on: ubuntu-latest
    steps:
      - name: Verify protected-branch push came through a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          associated_prs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == env.TARGET_BRANCH)] | length'
          )"

          if [ "${associated_prs}" -lt 1 ]; then
            echo "::error::P0 plans and phases must land through pull requests, not direct pushes to protected integration branches."
            exit 1
          fi

          echo "Protected-branch commit is associated with a merged pull request."
